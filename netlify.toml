[build]
  command = "npm run docs:build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  VITEPRESS_BASE = "/"

[context.deploy-preview.environment]
  VITEPRESS_BASE = "/"
